<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Broker Loading your Listing · Realtor Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#F4F1E8; --navy-2:#FBFAF4; --navy-3:#FFFFFF;
    --gold:#E0A227; --gold-soft:#B5821C; --gold-dim:#9A6F14;
    --cream:#10302A; --ink:#10302A; --muted:#5B6A60;
    --paper:#F4F1E8;
    --line:#DED7C6; --line-soft:#E4DECF;
    --err:#C0473A; --warn:#B5821C; --ok:#2E7D5B;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
    --shadow:0 30px 60px -48px rgba(16,48,42,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(212,168,50,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(212,168,50,.06), transparent 55%),
      var(--navy);
    color:var(--ink); font-family:var(--body),sans-serif; line-height:1.55;
    min-height:100vh; padding:28px 18px 70px;
  }
  .wrap{max-width:820px;margin:0 auto}
  header.brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .mark{width:44px;height:44px;border-radius:50%;background:var(--gold);
    display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 18px -6px rgba(212,168,50,.6)}
  .mark span{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;
    font-size:26px;color:var(--navy);line-height:1;transform:translateY(1px)}
  .brand h1{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.3px;
    font-size:30px;margin:0;color:var(--cream)}
  .brand .sub{font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);margin-top:2px}
  .tag{font-size:13px;color:var(--muted);margin:2px 0 22px 58px}

  .card{background:linear-gradient(180deg,var(--navy-2),var(--navy));border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .progress{height:4px;background:rgba(255,255,255,.05)}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-soft));
    width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .pad{padding:30px 32px 26px}
  .step-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;gap:10px}
  .step-meta .count{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  .step-meta .ctx{font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  h2.step-title{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:27px;color:var(--cream);margin:2px 0 10px}

  .do{font-size:14px;color:var(--ink);margin:0 0 18px;max-width:64ch}
  .do b{color:var(--cream)}
  .section-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin:18px 0 10px}

  .enter{border:1px solid var(--line-soft);border-radius:11px;overflow:hidden;margin-bottom:18px;background:rgba(255,255,255,.02)}
  .enter .eh{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);
    padding:9px 14px;border-bottom:1px solid var(--line-soft);background:rgba(212,168,50,.06)}
  .vrow{display:flex;justify-content:space-between;gap:14px;padding:9px 14px;border-bottom:1px solid rgba(143,160,189,.08);align-items:baseline}
  .vrow:last-child{border-bottom:none}
  .vrow .vl{font-size:12.5px;color:var(--muted);flex:0 0 auto}
  .vrow .vv{font-size:13.5px;text-align:right;font-weight:600;color:var(--gold-soft);word-break:break-word}
  .vrow .vv.empty{color:#5f7295;font-weight:400;font-style:italic}

  .tips{list-style:none;padding:0;margin:0 0 8px}
  .tips li{position:relative;padding:6px 0 6px 22px;font-size:12.5px;color:var(--ink)}
  .tips li:before{content:"";position:absolute;left:4px;top:13px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .caution{border-left:3px solid var(--warn);background:rgba(231,161,58,.08);padding:11px 14px;
    border-radius:0 9px 9px 0;font-size:12.5px;color:var(--ink);margin:4px 0 16px}
  .caution b{color:var(--warn)}

  .checks{display:flex;flex-direction:column;gap:11px;margin:6px 0 6px}
  .chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;border:1px solid var(--line-soft);
    border-radius:11px;padding:13px 15px;background:rgba(255,255,255,.02);transition:border-color .18s,background .18s}
  .chk:hover{border-color:var(--gold-dim)}
  .chk input{position:absolute;opacity:0;pointer-events:none}
  .chk .box{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-soft);
    margin-top:1px;display:grid;place-items:center;transition:all .18s}
  .chk .box:after{content:"✓";font-size:13px;color:var(--navy);opacity:0;transform:scale(.5);transition:all .18s}
  .chk input:checked ~ .box{background:var(--gold);border-color:var(--gold)}
  .chk input:checked ~ .box:after{opacity:1;transform:scale(1)}
  .chk .ct{font-size:13.5px;color:var(--ink)}
  .chk .ct small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
  .chk input:checked ~ .ct{color:var(--cream)}

  .choices{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .choice{flex:1;min-width:120px;cursor:pointer;position:relative}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice span{display:block;text-align:center;padding:12px 10px;border:1px solid var(--line-soft);
    border-radius:10px;background:var(--navy-3);font-size:13.5px;color:var(--ink);transition:all .18s}
  .choice input:checked + span{border-color:var(--gold);background:rgba(212,168,50,.12);color:var(--cream);box-shadow:0 0 0 1px var(--gold) inset}
  .choice:hover span{border-color:var(--gold-dim)}
  .qlabel{display:block;font-size:12px;letter-spacing:.4px;color:var(--ink);margin:14px 0 8px;font-weight:500}

  .err-msg{color:var(--err);font-size:12.5px;margin:4px 0 0;min-height:0}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line-soft)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600;font-size:13.5px;
    letter-spacing:.3px;padding:12px 22px;transition:transform .12s,filter .2s,background .2s}
  button:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:var(--navy)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line-soft)}
  .btn-ghost:hover{color:var(--cream);border-color:var(--gold-dim)}
  .btn-text{background:none;color:var(--muted);padding:12px 6px}
  .btn-text:hover{color:var(--gold-soft)}

  .start-actions{display:flex;flex-direction:column;gap:12px;margin:6px 0 4px}
  .step-note{font-size:13px;color:var(--muted);margin:0 0 18px;max-width:64ch}
  .saved-list{margin-top:6px;display:flex;flex-direction:column;gap:8px}
  .saved-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
    border:1px solid var(--line-soft);border-radius:10px;padding:11px 14px;background:rgba(255,255,255,.02)}
  .saved-item .si-addr{color:var(--cream);font-size:14px;font-weight:500}
  .saved-item .si-meta{font-size:11.5px;color:var(--muted)}
  .saved-item button{flex:0 0 auto}
  .mini{padding:7px 13px;font-size:12px}

  .rail{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 18px}
  .rdot{font-size:10.5px;color:var(--muted);border:1px solid var(--line-soft);border-radius:20px;padding:3px 9px}
  .rdot.done{color:var(--gold-soft);border-color:var(--line)}
  .rdot.cur{background:rgba(212,168,50,.14);color:var(--cream);border-color:var(--gold)}

  .finish-hero{text-align:center;padding:6px 0 4px}
  .seal{width:64px;height:64px;border-radius:50%;border:2px solid var(--gold);color:var(--gold);
    display:grid;place-items:center;margin:0 auto 14px;font-size:30px;font-family:"Cormorant Garamond",serif}
  .handoff{counter-reset:ho;margin:18px 0 6px;padding:0;list-style:none;text-align:left}
  .handoff li{position:relative;padding:0 0 14px 38px;font-size:13px;color:var(--ink)}
  .handoff li:before{counter-increment:ho;content:counter(ho);position:absolute;left:0;top:-2px;width:24px;height:24px;
    border-radius:50%;border:1px solid var(--gold);color:var(--gold-soft);display:grid;place-items:center;
    font-size:12px;font-weight:700;font-family:"Cormorant Garamond",serif}
  .handoff li:not(:last-child):after{content:"";position:absolute;left:11.5px;top:24px;bottom:2px;width:1px;background:var(--line-soft)}
  .handoff b{color:var(--gold-soft)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--gold);
    color:var(--navy);padding:11px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:all .3s;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .disclaimer{font-size:11px;color:var(--muted);line-height:1.5;margin-top:24px;padding-top:16px;border-top:1px solid var(--line-soft)}

  /* ===== Realtor Tutor re-skin (light theme) — visuals only, logic untouched ===== */
  header.brand{display:block;margin-bottom:6px}
  .brand h1{font-family:var(--display);font-weight:800;color:var(--ink)}
  .tag{margin-left:0}
  h2.step-title,.seal,.handoff li:before{font-family:var(--display)}
  .progress{background:#E7E1D2}
  .btn-primary{color:#0B221D}
  .chk .box:after{color:#0B221D}
  .toast{color:#0B221D}
  input::placeholder,textarea::placeholder{color:var(--muted)}
  .saved-item,.enter{background:rgba(16,48,42,.025)}
  .rt-top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
  .rt-top-in{max-width:820px;margin:0 auto;height:60px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .rt-back{display:inline-flex;align-items:center;gap:6px;color:#cfe0d8;text-decoration:none;font-weight:600;font-size:.92rem}
  .rt-back:hover{color:#fff}
  .rt-brand{font-family:var(--display);font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:.5ch;color:#fff}
  .rt-tick{width:9px;height:9px;background:var(--gold);border-radius:2px;transform:rotate(45deg);display:inline-block}
  .rt-spacer{width:74px}
  .rtgate{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center}
  .rtgate-box{font-family:var(--display);font-weight:700;color:var(--muted)}
</style>

<div class="rtgate" id="rtgate"><div class="rtgate-box">Checking your access…</div></div>
<div class="rt-top"><div class="rt-top-in">
  <a class="rt-back" href="../index.html">&larr; Dashboard</a>
  <span class="rt-brand"><span class="rt-tick"></span> Realtor Tutor</span>

</div></div>

<div class="wrap">
  <header class="brand">
    <h1>Broker Loading your Listing</h1>
    <div class="sub">Matrix · Guided walkthrough</div>
  </header>
  <div class="tag">Walks you through entering the listing into Matrix — what to do, what to type, in the right order.</div>

  <div class="card">
    <div class="progress"><i id="bar"></i></div>
    <div class="pad" id="screen"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="../gate.js"></script>
<script>window.requireMemberAccess({home:'../index.html'}).then(function(ok){if(ok){var g=document.getElementById('rtgate');if(g)g.remove();}});</script>

<script>
window.addEventListener('error',function(ev){__showErr(ev.error||ev.message);});
window.addEventListener('unhandledrejection',function(ev){__showErr(ev.reason);});
function __showErr(e){try{var el=document.getElementById('screen')||document.getElementById('app')||document.body;var d2=document.createElement('div');d2.style.cssText='color:#e08a8a;padding:18px 6px;font-size:13px;line-height:1.5';d2.innerHTML='This tool hit an error: <b>'+String((e&&e.message)||e).replace(/</g,'&lt;')+'</b><br>Screenshot this message and send it to Claude to fix.';el.appendChild(d2);}catch(_){}}

/* ---------- storage (self-host build: browser localStorage, shared per domain) ---------- */
const LS='bex_';
const store={
  async set(k,v){try{localStorage.setItem(LS+k,v);}catch(e){}},
  async get(k){try{return localStorage.getItem(LS+k);}catch(e){return null;}},
  async del(k){try{localStorage.removeItem(LS+k);}catch(e){}},
  async list(p){try{const o=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf(LS+p)===0)o.push(key.slice(LS.length));}return o;}catch(e){return [];}}
};

/* ---------- state ---------- */
let d={};               // listing data (from Listing Intake or manual mini-set)
let listingKey=null;    // 'listing:...' if linked
let progressKey=null;   // 'brokerload:...'
let stage='start';      // start | manualq | flow
let idx=0;              // index into flow cards
let done={};            // step id -> true

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2000);}
const money=v=>v?'$'+Number(v).toLocaleString():'';
const date=s=>s?new Date(s+'T00:00').toLocaleDateString('en-CA'):'';
function getRadio(n){const e=document.querySelector(`input[name="${n}"]:checked`);return e?e.value:'';}
function radios(name,opts,cur){return `<div class="choices">`+opts.map(o=>{
  const v=o.v,l=o.l;return `<label class="choice"><input type="radio" name="${name}" value="${esc(v)}" ${cur===v?'checked':''}><span>${esc(l)}</span></label>`;
}).join('')+`</div>`;}
function vrow(label,value){const has=value!==undefined&&value!==null&&value!=='';
  return `<div class="vrow"><span class="vl">${esc(label)}</span><span class="vv ${has?'':'empty'}">${has?esc(value):'enter from your file'}</span></div>`;}
function enterBlock(title,rows){return `<div class="enter"><div class="eh">${esc(title)}</div>${rows.join('')}</div>`;}
function tips(arr){return `<ul class="tips">`+arr.map(t=>`<li>${t}</li>`).join('')+`</ul>`;}

/* ---------- load steps ---------- */
const loadSteps=[
  {id:'login',title:'Log in to Matrix',
    do:`Sign in to the <b>ITSO / Cornerstone Matrix</b> system with your Clareity Assure or REALTOR.ca credentials, then open the <b>Add/Edit</b> module.`,
    tips:['This is Matrix — ignore any PropTx prompts you come across.','No Super Subscriber access? Real’s broker support loads it instead.']},

  {id:'class',title:'Start the listing & pick property class',
    do:`In <b>Add/Edit</b>, choose <b>Add new listing</b>, then select the property class and its matching input form.`,
    enter:d=>enterBlock('Select',[vrow('Property class', d.ptype==='condo'?'Residential Condo':d.ptype==='freehold'?'Residential Freehold':'')]),
    caution:`<b>Can't be changed later.</b> If the class is wrong you re-enter the whole listing — confirm freehold vs condo before you click.`},

  {id:'registry',title:'Pull registry data',
    do:`Enter the PIN or address so Matrix pre-populates land registry and assessment data.`,
    enter:d=>enterBlock('Type in',[vrow('Address',d.address),vrow('PIN / legal',d.legal)]),
    tips:['Verify every pulled field against actual title — don\'t trust the pull blindly.']},

  {id:'mandatory',title:'Complete the mandatory fields',
    do:`Work top to bottom. Matrix highlights required fields in <b>yellow</b> and won't let you submit until they're filled. Match each to your Cornerstone Property Information Form.`,
    enter:d=>enterBlock('Type in',[vrow('List price',money(d.price)),vrow('Commencement',date(d.startDate)),vrow('Expiry',date(d.expiry)),vrow('Lot / dimensions',d.lot),vrow('Survey available',d.survey)])},

  {id:'rooms',title:'Rooms & measurements',
    do:`Enter each room with its dimensions, room by room.`,
    caution:`<b>Imperial is required</b> on this system — metric measurements get bounced. Measure consistently (wall-to-wall) and check your totals.`},

  {id:'financials',title:'Taxes, fees & inclusions',
    do:`Enter the financial fields and the inclusion/exclusion lists.`,
    enter:d=>{const rows=[vrow('Annual tax', d.tax?money(d.tax)+(d.taxYear?' ('+d.taxYear+')':''):'')];
      if(d.ptype==='condo'){rows.push(vrow('Maintenance fee', d.fee?money(d.fee)+'/mo':''));rows.push(vrow('Fee includes',d.feeIncl));}
      rows.push(vrow('Chattels included',d.incl));rows.push(vrow('Fixtures excluded',d.excl));rows.push(vrow('Rentals',d.rentals));
      return enterBlock('Type in',rows);},
    tips:['Vague inclusion lists are a top source of post-acceptance disputes — be specific.']},

  {id:'condo',title:'Condo specifics',visible:d=>d.ptype==='condo',
    do:`Enter the condominium details on the condo input fields.`,
    enter:d=>enterBlock('Type in',[vrow('Corporation',d.corp),vrow('Parking',d.parking),vrow('Locker',d.locker)]),
    caution:`<b>Status Certificate:</b> ${d&&d.statusCert==='yes'?'ordered ✓ — keep the timeline in mind, it gates offer review.':'order it now if you haven\'t. The corporation can take up to 10 days and it gates offer review.'}`},

  {id:'remuneration',title:'Remuneration',
    do:`Enter the cooperating compensation exactly as documented on the seller's agreement.`,
    enter:d=>enterBlock('Type in',[vrow('Total remuneration',d.commTotal),vrow('Offered to co-op brokerage',d.commCoop)]),
    tips:['This was the seller\'s decision — any condition where it changes must already be in writing.']},

  {id:'offers',title:'Offer handling',
    do:d=>d.delay==='yes'
      ? `You're <b>holding offers</b>. Set the offer review date/time and make sure the <b>Seller's Direction (Form 244)</b> is on file.`
      : `Offers are reviewed <b>as received</b>. Set the bidding election.`,
    enter:d=>{const rows=[];
      if(d.delay==='yes'){rows.push(vrow('Offer review date',date(d.offerDate)));rows.push(vrow('Offer review time',d.offerTime));rows.push(vrow('Form 244','required — confirm on file'));}
      rows.push(vrow('Bidding election', d.bidding==='open'?'Open / disclosed':d.bidding==='closed'?'Traditional / undisclosed':''));
      return enterBlock('Set',rows);},
    tips:['Under TRESA you must handle and disclose offers consistently to every buyer.']},

  {id:'showing',title:'Showing setup (BrokerBay)',
    do:`Launch <b>BrokerBay</b> from your Matrix dashboard and configure the lockbox, showing instructions, approval workflow, and notice requirements.`,
    enter:d=> d.occ==='tenant' ? enterBlock('Tenant-occupied',[vrow('Showing consent on file', d.tenantConsent==='yes'?'Yes ✓':'Not yet — get written consent'),vrow('Notice','Respect RTA notice rules')]) : '',
    tips:['Set realistic notice windows so showings don\'t stall.']},

  {id:'media',title:'Photos, floor plans & virtual tour',
    do:`Open <b>Manage Photos</b> and upload your images. Add floor plans. Enter the virtual tour links.`,
    caution:`<b>Branded vs non-branded tour:</b> put the <b>non-branded</b> link (no name/contact) in the non-branded field — that's the one that feeds REALTOR.ca. A branded tour goes only in the branded field.`,
    tips:['At least one photo is required.','No marketing or branding text on the images themselves.']},

  {id:'remarks',title:'Remarks',
    do:`Write your two remark blocks.`,
    enter:d=>enterBlock('Two fields',[vrow('Public remarks','Property only — no contact info / solicitation'),vrow('REALTOR® remarks','Agent-only: showing & offer instructions')])},

  {id:'submit',title:'Validate & activate',
    do:`Clear any remaining yellow/error flags, then <b>Submit / Activate</b>. Confirm the status reads <b>Active</b>, and save a full printout of the active listing.`,
    tips:['Your brokerage file needs the printout, and so does any interboard processing.']},

  {id:'verify',title:'Verify distribution',
    do:`Within <b>24–48 hours</b>, confirm the listing appears correctly on <b>REALTOR.ca</b> (via the OneHome/DDF feed).`,
    tips:['Check that photos and the non-branded virtual tour came through.']}
];

function visibleLoad(){return loadSteps.filter(s=>!s.visible||s.visible(d));}
function flowCards(){return ['__preflight__'].concat(visibleLoad().map(s=>s.id)).concat(['__finish__']);}

/* ---------- render ---------- */
function setBar(){
  if(stage!=='flow'){$("#bar").style.width='0%';return;}
  const fc=flowCards();$("#bar").style.width=(idx/(fc.length-1))*100+'%';
}
function render(){
  setBar();
  if(stage==='start')return renderStart();
  if(stage==='manualq')return renderManualQ();
  return renderFlow();
}

async function renderStart(){
  const keys=await store.list('listing:');
  const items=[];
  for(const k of keys){const v=await store.get(k);if(v){let o;try{o=JSON.parse(v);}catch(e){o=null;}if(o)items.push({k,o});}}
  items.sort((a,b)=>(b.o._updated||0)-(a.o._updated||0));
  let saved='';
  if(items.length){
    saved=`<div class="section-label">Load a listing from your Listing Intake</div><div class="saved-list">`+
      items.map(it=>`<div class="saved-item">
        <div><div class="si-addr">${esc(it.o.address||'Untitled listing')}</div>
          <div class="si-meta">${esc(it.o.city||'')}${it.o.price?' · '+money(it.o.price):''} · ${it.o.ptype==='condo'?'Condo':'Freehold'}${it.o.occ==='tenant'?' · tenant':''}</div></div>
        <button class="mini btn-primary" onclick="link('${it.k}')">Walk me through →</button>
      </div>`).join('')+`</div>`;
  } else {
    saved=`<div class="step-note" style="margin-top:8px">No saved listings found from the Listing Intake wizard yet. Start manually and I'll still prompt you through every step in order.</div>`;
  }
  $("#screen").innerHTML=`
    <div class="step-meta"><span class="count">Begin</span></div>
    <h2 class="step-title">Broker load a listing</h2>
    <p class="step-note">Pick a listing you onboarded in the Listing Intake wizard and I'll prompt you through the Matrix entry — every action and the exact values to type, in order. Condo and tenant steps appear only when they apply.</p>
    ${saved}
    <div class="section-label">Or</div>
    <div class="start-actions"><button class="btn-ghost" onclick="startManual()">Start manually (no Listing Intake data)</button></div>
    <div class="disclaimer">Guidance reflects the Cornerstone/ITSO Matrix workflow and current OREA forms. Field labels live behind your member login — follow the yellow required fields on screen. Not a substitute for MLS rules or brokerage policy.</div>`;
}

function renderManualQ(){
  $("#screen").innerHTML=`
    <div class="step-meta"><span class="count">Quick setup</span></div>
    <h2 class="step-title">A few things to branch correctly</h2>
    <p class="step-note">These tell me which steps to show. I'll prompt the actions in order — you'll fill the values from your own file as you go.</p>
    <span class="qlabel">Property type</span>
    ${radios('m_ptype',[{v:'freehold',l:'Freehold'},{v:'condo',l:'Condo'}],d.ptype)}
    <span class="qlabel">Occupancy</span>
    ${radios('m_occ',[{v:'owner',l:'Owner / vacant'},{v:'tenant',l:'Tenant-occupied'}],d.occ)}
    <span class="qlabel">Holding offers?</span>
    ${radios('m_delay',[{v:'yes',l:'Yes — delay offers'},{v:'no',l:'No'}],d.delay)}
    <div class="err-msg" id="err"></div>
    <div class="nav">
      <button class="btn-ghost" onclick="toStart()">← Back</button>
      <button class="btn-primary" onclick="manualGo()">Start walkthrough →</button>
    </div>`;
}

function renderFlow(){
  const fc=flowCards();const card=fc[idx];
  if(card==='__preflight__')return renderPreflight();
  if(card==='__finish__')return renderFinish();
  const s=visibleLoad().find(x=>x.id===card);
  const stepNum=idx; const totalLoad=visibleLoad().length;
  const doTxt=typeof s.do==='function'?s.do(d):s.do;
  const enterHtml=s.enter?(typeof s.enter==='function'?s.enter(d):s.enter):'';
  const rail=visibleLoad().map((x,i)=>{const cls=done[x.id]?'done':(x.id===s.id?'cur':'');return `<span class="rdot ${cls}">${i+1}</span>`;}).join('');
  $("#screen").innerHTML=`
    <div class="step-meta"><span class="count">Load step ${stepNum} of ${totalLoad}</span>
      <span class="ctx">${esc(d.address||'')}</span></div>
    <div class="rail">${rail}</div>
    <h2 class="step-title">${esc(s.title)}</h2>
    <p class="do">${doTxt}</p>
    ${enterHtml||''}
    ${s.caution?`<div class="caution">${s.caution}</div>`:''}
    ${s.tips?tips(s.tips):''}
    <div class="nav">
      <button class="btn-ghost" onclick="prev()">← Back</button>
      <div style="display:flex;gap:10px">
        <button class="btn-text" onclick="saveExit()">Save &amp; exit</button>
        <button class="btn-primary" onclick="markNext('${s.id}')">Done — next →</button>
      </div>
    </div>`;
}

function renderPreflight(){
  const condoWarn = d.ptype==='condo' && d.statusCert!=='yes'
    ? `<div class="caution"><b>Condo:</b> order the Status Certificate now — it can take up to 10 days and gates offer review.</div>` : '';
  $("#screen").innerHTML=`
    <div class="step-meta"><span class="count">Pre-flight</span><span class="ctx">${esc(d.address||'')}</span></div>
    <h2 class="step-title">Before you load</h2>
    <p class="step-note">Confirm these three, then we'll go field by field.</p>
    ${condoWarn}
    <div class="checks">
      <label class="chk"><input type="checkbox" id="pf1" ${done._pf1?'checked':''}><span class="box"></span>
        <span class="ct">I have <b>Super Subscriber</b> access<small>Required to enter & activate listings yourself. If not, Real’s broker support loads it.</small></span></label>
      <label class="chk"><input type="checkbox" id="pf2" ${done._pf2?'checked':''}><span class="box"></span>
        <span class="ct">Paperwork is signed and my data is ready<small>Property Information Form values, photos (min 1, no branding), imperial measurements.</small></span></label>
      <label class="chk"><input type="checkbox" id="pf3" ${done._pf3?'checked':''}><span class="box"></span>
        <span class="ct">I know the deadline<small>ITSO requires the listing in the system by 11:59 p.m. the business day after the commencement date.</small></span></label>
    </div>
    <div class="err-msg" id="err"></div>
    <div class="nav">
      <button class="btn-ghost" onclick="toStart()">← Start over</button>
      <button class="btn-primary" onclick="preflightGo()">Begin loading →</button>
    </div>`;
}

function renderFinish(){
  const condoTip = d.ptype==='condo' && d.statusCert!=='yes'
    ? `<li>Confirm the <b>Status Certificate</b> is ordered if you haven't already.</li>`:'';
  $("#screen").innerHTML=`
    <div class="step-meta"><span class="count">Complete</span><span class="ctx">${esc(d.address||'')}</span></div>
    <div class="finish-hero">
      <div class="seal">✓</div>
      <h2 class="step-title">${esc(d.address||'Listing')} is loaded</h2>
      <p class="step-note" style="margin:0 auto">All Matrix steps are done. One thing remains — closing the loop on the paperwork.</p>
    </div>
    <div class="section-label">Final hand-off</div>
    <ol class="handoff">
      ${condoTip}
      <li>Submit the executed deal to <b>Real</b> for compliance &amp; retention.</li>
      <li>Retention clocks: <b>TRESA 6 years</b> after completion · <b>FINTRAC 5 years</b> from creation.</li>
      <li>Any later change (price, status, correction) → update it in Matrix and keep the new printout.</li>
    </ol>
    <div class="nav">
      <button class="btn-ghost" onclick="prev()">← Back</button>
      <button class="btn-primary" onclick="saveExit(true)">Mark loaded &amp; finish</button>
    </div>`;
}

/* ---------- navigation ---------- */
async function link(k){
  const v=await store.get(k); if(!v){toast('Could not open');return;}
  d=JSON.parse(v); listingKey=k; progressKey='brokerload:'+k.replace('listing:','');
  const saved=await store.get(progressKey); if(saved){try{done=JSON.parse(saved);}catch(e){done={};}}
  stage='flow'; idx=0; render();
}
function startManual(){ d={}; listingKey=null; progressKey='brokerload:manual:'+Date.now(); done={}; stage='manualq'; render(); }
function manualGo(){
  const pt=getRadio('m_ptype'),oc=getRadio('m_occ'),dl=getRadio('m_delay');
  if(!pt||!oc||!dl){$("#err").textContent='Answer all three to branch correctly.';return;}
  d.ptype=pt;d.occ=oc;d.delay=dl; stage='flow'; idx=0; render();
}
function toStart(){ stage='start'; idx=0; render(); }
function preflightGo(){
  done._pf1=$("#pf1").checked;done._pf2=$("#pf2").checked;done._pf3=$("#pf3").checked;
  if(!done._pf1||!done._pf2||!done._pf3){$("#err").textContent='Confirm all three before loading.';return;}
  saveProgress(); idx++; window.scrollTo({top:0,behavior:'smooth'}); render();
}
function markNext(id){ done[id]=true; saveProgress(); idx++; window.scrollTo({top:0,behavior:'smooth'}); render(); }
function prev(){ if(idx>0){idx--; window.scrollTo({top:0,behavior:'smooth'}); render();} else toStart(); }

async function saveProgress(){ if(!progressKey)return; try{await store.set(progressKey,JSON.stringify(done));}catch(e){} }
async function saveExit(complete){
  if(complete){ visibleLoad().forEach(s=>done[s.id]=true); done._complete=true; }
  await saveProgress();
  toast(complete?'Listing marked loaded':'Progress saved');
  stage='start'; idx=0; window.scrollTo({top:0,behavior:'smooth'}); render();
}

/* boot */
(async function(){
  try{
    const q=new URLSearchParams(window.location.search).get('listing');
    if(q){ const v=await store.get(q); if(v){ await link(q); return; } }
  }catch(e){}
  render();
})();
</script>
