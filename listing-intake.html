<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listing Intake Wizard · Realtor Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#F4F1E8; --navy-2:#FBFAF4; --navy-3:#FFFFFF;
    --gold:#E0A227; --gold-soft:#B5821C; --gold-dim:#9A6F14;
    --cream:#10302A; --ink:#10302A; --muted:#5B6A60;
    --paper:#F4F1E8;
    --line:#DED7C6; --line-soft:#E4DECF;
    --ok:#2E7D5B; --warn:#B5821C; --err:#C0473A;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
    --shadow:0 30px 60px -48px rgba(16,48,42,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(212,168,50,.10), transparent 60%),
      radial-gradient(900px 600px at -10% 110%, rgba(212,168,50,.06), transparent 55%),
      var(--navy);
    color:var(--ink); font-family:var(--body),sans-serif; line-height:1.55;
    min-height:100vh; padding:28px 18px 70px;
  }
  .wrap{max-width:820px;margin:0 auto}
  header.brand{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .mark{width:44px;height:44px;border-radius:50%;background:var(--gold);
    display:grid;place-items:center;flex:0 0 auto;box-shadow:0 6px 18px -6px rgba(212,168,50,.6)}
  .mark span{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;
    font-size:26px;color:var(--navy);line-height:1;transform:translateY(1px)}
  .brand h1{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.3px;
    font-size:30px;margin:0;color:var(--cream)}
  .brand .sub{font-size:11.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);margin-top:2px}
  .tag{font-size:13px;color:var(--muted);margin:2px 0 22px 58px}

  .card{background:linear-gradient(180deg,var(--navy-2),var(--navy));border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
  .progress{height:4px;background:rgba(255,255,255,.05)}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold),var(--gold-soft));
    width:0;transition:width .45s cubic-bezier(.4,0,.2,1)}
  .pad{padding:30px 32px 26px}
  .step-meta{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .step-meta .count{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
  .step-meta .saved{font-size:11px;color:var(--muted)}
  h2.step-title{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:27px;
    color:var(--cream);margin:2px 0 4px}
  .step-note{font-size:13px;color:var(--muted);margin:0 0 22px;max-width:62ch}
  .step-note b{color:var(--gold-soft);font-weight:600}

  .field{margin-bottom:17px}
  label{display:block;font-size:12px;letter-spacing:.4px;color:var(--ink);margin-bottom:6px;font-weight:500}
  label .req{color:var(--gold);margin-left:3px}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.45}
  input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],textarea,select{
    width:100%;background:var(--navy-3);border:1px solid var(--line-soft);color:var(--cream);
    border-radius:9px;padding:11px 13px;font-family:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s}
  textarea{resize:vertical;min-height:64px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);
    box-shadow:0 0 0 3px rgba(212,168,50,.16)}
  input::placeholder,textarea::placeholder{color:#5f7295}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row > .field{flex:1;min-width:150px}

  .choices{display:flex;gap:10px;flex-wrap:wrap}
  .choice{flex:1;min-width:120px;cursor:pointer;position:relative}
  .choice input{position:absolute;opacity:0;pointer-events:none}
  .choice span{display:block;text-align:center;padding:12px 10px;border:1px solid var(--line-soft);
    border-radius:10px;background:var(--navy-3);font-size:13.5px;color:var(--ink);transition:all .18s}
  .choice input:checked + span{border-color:var(--gold);background:rgba(212,168,50,.12);
    color:var(--cream);box-shadow:0 0 0 1px var(--gold) inset}
  .choice:hover span{border-color:var(--gold-dim)}

  .seller-card{border:1px solid var(--line-soft);border-radius:12px;padding:16px 16px 4px;margin-bottom:14px;
    background:rgba(255,255,255,.02)}
  .seller-card h4{font-family:"Cormorant Garamond",serif;font-size:18px;color:var(--gold-soft);
    margin:0 0 12px;font-weight:600}

  .callout{border-left:3px solid var(--gold);background:rgba(212,168,50,.07);
    padding:11px 14px;border-radius:0 9px 9px 0;font-size:12.5px;color:var(--ink);margin:4px 0 20px}
  .callout b{color:var(--gold-soft)}

  .err-msg{color:var(--err);font-size:12.5px;margin:-8px 0 14px;min-height:0}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;
    padding-top:20px;border-top:1px solid var(--line-soft)}
  button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-weight:600;
    font-size:13.5px;letter-spacing:.3px;padding:12px 22px;transition:transform .12s,filter .2s,background .2s}
  button:active{transform:translateY(1px)}
  .btn-primary{background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:var(--navy)}
  .btn-primary:hover{filter:brightness(1.06)}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line-soft)}
  .btn-ghost:hover{color:var(--cream);border-color:var(--gold-dim)}
  .btn-text{background:none;color:var(--muted);padding:12px 6px}
  .btn-text:hover{color:var(--gold-soft)}

  /* start screen */
  .start-actions{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .saved-list{margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .saved-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
    border:1px solid var(--line-soft);border-radius:10px;padding:11px 14px;background:rgba(255,255,255,.02)}
  .saved-item .si-main{min-width:0}
  .saved-item .si-addr{color:var(--cream);font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .saved-item .si-meta{font-size:11.5px;color:var(--muted)}
  .saved-item .si-btns{display:flex;gap:6px;flex:0 0 auto}
  .mini{padding:7px 12px;font-size:12px}
  .mini.del{background:transparent;color:var(--err);border:1px solid rgba(224,113,107,.35)}
  .mini.del:hover{background:rgba(224,113,107,.12)}

  /* review/output */
  .forms-grid{display:flex;flex-direction:column;gap:9px;margin:6px 0 22px}
  .form-row{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--line-soft);
    border-radius:10px;padding:12px 14px;background:rgba(255,255,255,.02)}
  .form-row .fr-badge{flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.5px;
    padding:3px 8px;border-radius:20px;margin-top:1px}
  .fr-req{background:rgba(212,168,50,.16);color:var(--gold-soft);border:1px solid var(--line)}
  .fr-opt{background:rgba(143,160,189,.12);color:var(--muted);border:1px solid var(--line-soft)}
  .form-row .fr-body{min-width:0}
  .form-row .fr-name{color:var(--cream);font-size:14px;font-weight:600}
  .form-row .fr-desc{font-size:12px;color:var(--muted);margin-top:2px}

  .pkg{background:#0a1322;border:1px solid var(--line-soft);border-radius:11px;
    padding:0;overflow:hidden;margin-bottom:8px}
  .pkg-head{display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;border-bottom:1px solid var(--line-soft);background:rgba(255,255,255,.02)}
  .pkg-head span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
  #pkgText{width:100%;border:none;background:transparent;color:var(--ink);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.6;
    padding:14px;min-height:280px;resize:vertical}
  #pkgText:focus{outline:none;box-shadow:none}

  .signers{display:flex;flex-direction:column;gap:8px;margin:6px 0 22px}
  .signer{display:flex;align-items:center;gap:10px;border:1px solid var(--line-soft);
    border-radius:9px;padding:10px 13px;background:rgba(255,255,255,.02)}
  .signer .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:0 0 auto}
  .signer .s-name{color:var(--cream);font-weight:500;font-size:13.5px}
  .signer .s-email{color:var(--muted);font-size:12px;margin-left:auto}
  .signer .s-email.missing{color:var(--err)}

  .handoff{counter-reset:ho;margin:4px 0 6px;padding:0;list-style:none}
  .handoff li{position:relative;padding:0 0 14px 38px;font-size:13px;color:var(--ink)}
  .handoff li:before{counter-increment:ho;content:counter(ho);position:absolute;left:0;top:-2px;
    width:24px;height:24px;border-radius:50%;border:1px solid var(--gold);color:var(--gold-soft);
    display:grid;place-items:center;font-size:12px;font-weight:700;font-family:"Cormorant Garamond",serif}
  .handoff li:not(:last-child):after{content:"";position:absolute;left:11.5px;top:24px;bottom:2px;width:1px;background:var(--line-soft)}
  .handoff b{color:var(--gold-soft)}

  .section-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);
    margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--gold);color:var(--navy);padding:11px 20px;border-radius:30px;font-size:13px;
    font-weight:600;opacity:0;pointer-events:none;transition:all .3s;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .disclaimer{font-size:11px;color:var(--muted);line-height:1.5;margin-top:28px;
    padding-top:16px;border-top:1px solid var(--line-soft)}
  @media print{body{background:#fff;color:#000}.nav,.progress,.brand .sub,.rt-top,.rtgate{display:none}}

  /* ===== Realtor Tutor re-skin (light theme) — visuals only, logic untouched ===== */
  header.brand{display:block;margin-bottom:6px}
  .brand h1{font-family:var(--display);font-weight:800;color:var(--ink)}
  .tag{margin-left:0}
  h2.step-title,.seller-card h4{font-family:var(--display)}
  .handoff li:before{font-family:var(--display)}
  .progress{background:#E7E1D2}
  .btn-primary{color:#0B221D}
  input::placeholder,textarea::placeholder{color:var(--muted)}
  .pkg{background:#fff}
  .toast{color:#0B221D}
  .saved-item,.form-row,.signer,.pkg-head,.seller-card{background:rgba(16,48,42,.025)}
  /* dashboard topbar */
  .rt-top{position:sticky;top:0;z-index:30;background:var(--ink);color:#fff}
  .rt-top-in{max-width:820px;margin:0 auto;height:60px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .rt-back{display:inline-flex;align-items:center;gap:6px;color:#cfe0d8;text-decoration:none;font-weight:600;font-size:.92rem}
  .rt-back:hover{color:#fff}
  .rt-brand{font-family:var(--display);font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:.5ch;color:#fff}
  .rt-tick{width:9px;height:9px;background:var(--gold);border-radius:2px;transform:rotate(45deg);display:inline-block}
  .rt-spacer{width:74px}
  /* members access gate overlay */
  .rtgate{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;align-items:center;justify-content:center}
  .rtgate-box{font-family:var(--display);font-weight:700;color:var(--muted)}
</style>

<div class="rtgate" id="rtgate"><div class="rtgate-box">Checking your access…</div></div>
<div class="rt-top"><div class="rt-top-in">
  <a class="rt-back" href="../index.html">&larr; Dashboard</a>
  <span class="rt-brand"><span class="rt-tick"></span> Realtor Tutor</span>
  <span class="rt-spacer"></span>
</div></div>

<div class="wrap">
  <header class="brand">
    <h1>Listing Intake</h1>
    <div class="sub">In TRESA order · for Transaction Desk &amp; Authentisign</div>
  </header>
  <div class="tag">Walks you through every input for listing onboarding — in TRESA order — then hands you a clean package for Transaction Desk &amp; Authentisign.</div>

  <div class="card">
    <div class="progress"><i id="bar"></i></div>
    <div class="pad" id="screen"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="../gate.js"></script>
<script>window.requireMemberAccess({home:'../index.html'}).then(function(ok){if(ok){var g=document.getElementById('rtgate');if(g)g.remove();}});</script>

<script>
window.addEventListener('error',function(ev){__showErr(ev.error||ev.message);});
window.addEventListener('unhandledrejection',function(ev){__showErr(ev.reason);});
function __showErr(e){try{var el=document.getElementById('screen')||document.getElementById('app')||document.body;var d2=document.createElement('div');d2.style.cssText='color:#e08a8a;padding:18px 6px;font-size:13px;line-height:1.5';d2.innerHTML='This tool hit an error: <b>'+String((e&&e.message)||e).replace(/</g,'&lt;')+'</b><br>Screenshot this message and send it to Claude to fix.';el.appendChild(d2);}catch(_){}}

/* ---------- storage (self-host build: browser localStorage, shared per domain) ---------- */
const LS='bex_';
const store={
  async set(k,v){try{localStorage.setItem(LS+k,v);}catch(e){}},
  async get(k){try{return localStorage.getItem(LS+k);}catch(e){return null;}},
  async del(k){try{localStorage.removeItem(LS+k);}catch(e){}},
  async list(p){try{const o=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key&&key.indexOf(LS+p)===0)o.push(key.slice(LS.length));}return o;}catch(e){return [];}}
};

/* ---------- state ---------- */
let data = {};
let stepIdx = 0;
let listingKey = null;

function blank(){ return {
  sellerCount:1, sellers:[{}],
  brokerage:"Real Broker", agent:"Rebecca Zak"
};}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
const isEmail = s => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s||"");
function radios(name,opts,cur){
  return `<div class="choices">`+opts.map(o=>{
    const v=typeof o==='string'?o:o.v, l=typeof o==='string'?o:o.l;
    return `<label class="choice"><input type="radio" name="${name}" value="${esc(v)}" ${cur===v?'checked':''}><span>${esc(l)}</span></label>`;
  }).join('')+`</div>`;
}
function getRadio(name){const el=document.querySelector(`input[name="${name}"]:checked`);return el?el.value:'';}

/* ---------- steps ---------- */
const steps = [
  { id:'start', start:true },

  { id:'property', title:'Property Basics', count:'The address & shape of the deal',
    note:'This determines which extra forms you’ll need — condo and tenant situations branch from here.',
    render:d=>`
      <div class="field"><label>Property address <span class="req">*</span></label>
        <input type="text" id="address" value="${esc(d.address)}" placeholder="123 Sulphur Springs Rd"></div>
      <div class="field"><label>City / area <span class="req">*</span></label>
        ${radios('city',['Dundas','Ancaster','Burlington','Hamilton','Other'],d.city)}</div>
      <div class="field"><label>Property type <span class="req">*</span></label>
        ${radios('ptype',[{v:'freehold',l:'Freehold'},{v:'condo',l:'Condo / strata'}],d.ptype)}</div>
      <div class="field"><label>Occupancy <span class="req">*</span></label>
        ${radios('occ',[{v:'owner',l:'Owner-occupied'},{v:'tenant',l:'Tenant-occupied'},{v:'vacant',l:'Vacant'}],d.occ)}</div>`,
    collect:d=>{d.address=$("#address").value.trim();d.city=getRadio('city');d.ptype=getRadio('ptype');d.occ=getRadio('occ');},
    validate:d=> !d.address?'Enter the property address.': !d.city?'Choose a city/area.': !d.ptype?'Choose a property type.': !d.occ?'Choose occupancy.':null
  },

  { id:'preservice', title:'Pre-Service (TRESA Gate)', count:'Before anything is signed',
    note:'Under TRESA the <b>RECO Information Guide</b> must be given before you enter into a representation agreement. Record it here so the sequence is defensible.',
    render:d=>`
      <div class="field"><label>RECO Information Guide provided to seller? <span class="req">*</span></label>
        ${radios('reco',[{v:'yes',l:'Yes'},{v:'no',l:'Not yet'}],d.reco)}
        <div class="hint">Must come <b>before</b> the listing agreement is signed.</div></div>
      <div class="field"><label>Date RECO Guide provided</label>
        <input type="date" id="recoDate" value="${esc(d.recoDate)}"></div>
      <div class="field"><label>Relationship <span class="req">*</span></label>
        ${radios('rel',[{v:'client',l:'Client → Form 271'},{v:'customer',l:'Self-represented → Form 216'}],d.rel)}
        <div class="hint">Client = designated representation (Form 271). Self-represented = no representation — TRESA requires the Form 216 acknowledgement.</div></div>`,
    collect:d=>{d.reco=getRadio('reco');d.recoDate=$("#recoDate").value;d.rel=getRadio('rel');},
    validate:d=> !d.reco?'Note whether the RECO Guide was provided.': !d.rel?'Choose the relationship type.':null
  },

  { id:'sellers', title:'Seller(s)', count:'For the agreement, FINTRAC & signing',
    note:'Emails are required — they’re the signing addresses for Authentisign. <b>Do not enter ID numbers here</b>; verify identity and record the type only, then enter the actual ID details directly in the FINTRAC form in WEBForms.',
    render:d=>{
      let h=`<div class="field"><label>How many sellers are on title? <span class="req">*</span></label>
        ${radios('scount',[{v:'1',l:'1'},{v:'2',l:'2'},{v:'3',l:'3'},{v:'4',l:'4'}],String(d.sellerCount||1))}</div>
        <div class="callout"><b>Matrimonial home check:</b> if this is a matrimonial home, both spouses must consent to the sale under the Family Law Act — even if only one is on title.</div>`;
      const n=d.sellerCount||1;
      for(let i=0;i<n;i++){const s=d.sellers[i]||{};
        h+=`<div class="seller-card"><h4>Seller ${i+1}</h4>
          <div class="field"><label>Full legal name <span class="req">*</span></label>
            <input type="text" id="s${i}_name" value="${esc(s.name)}" placeholder="As it appears on title"></div>
          <div class="row">
            <div class="field"><label>Email (for signing) <span class="req">*</span></label>
              <input type="email" id="s${i}_email" value="${esc(s.email)}" placeholder="name@email.com"></div>
            <div class="field"><label>Phone</label>
              <input type="tel" id="s${i}_phone" value="${esc(s.phone)}" placeholder="(905) 000-0000"></div>
          </div>
          <div class="field"><label>FINTRAC ID verified? &nbsp;(Form 630)</label>
            ${radios('s'+i+'_idv',[{v:'yes',l:'Verified'},{v:'no',l:'Pending'}],s.idv)}</div>
          <div class="row">
            <div class="field"><label>ID type</label>
              <input type="text" id="s${i}_idtype" value="${esc(s.idtype)}" placeholder="e.g. Ontario driver's licence"></div>
            <div class="field"><label>Verification date</label>
              <input type="date" id="s${i}_iddate" value="${esc(s.iddate)}"></div>
          </div></div>`;
      }
      return h;
    },
    onMount:d=>{
      document.querySelectorAll('input[name="scount"]').forEach(r=>r.addEventListener('change',()=>{
        collectStep(d); d.sellerCount=parseInt(getRadio('scount')||'1',10);
        while(d.sellers.length<d.sellerCount) d.sellers.push({});
        renderStep();
      }));
    },
    collect:d=>{
      d.sellerCount=parseInt(getRadio('scount')||d.sellerCount||1,10);
      for(let i=0;i<d.sellerCount;i++){
        d.sellers[i]=d.sellers[i]||{};
        const g=id=>{const e=$("#s"+i+"_"+id);return e?e.value.trim():'';};
        d.sellers[i]={name:g('name'),email:g('email'),phone:g('phone'),
          idv:getRadio('s'+i+'_idv'),idtype:g('idtype'),iddate:($("#s"+i+"_iddate")||{}).value||''};
      }
      d.sellers.length=d.sellerCount;
    },
    validate:d=>{
      for(let i=0;i<d.sellerCount;i++){const s=d.sellers[i];
        if(!s.name) return `Enter Seller ${i+1}’s full legal name.`;
        if(!s.email) return `Enter Seller ${i+1}’s email (needed for signing).`;
        if(!isEmail(s.email)) return `Seller ${i+1}’s email doesn’t look valid.`;
      } return null;
    }
  },

  { id:'legal', title:'Property & Legal', count:'Title, taxes & lot',
    note:'These populate the legal portion of the agreement and the MLS data form. Verify the registry pull against actual title.',
    render:d=>`
      <div class="field"><label>Legal description / PIN</label>
        <input type="text" id="legal" value="${esc(d.legal)}" placeholder="Plan / Lot / PIN"></div>
      <div class="row">
        <div class="field"><label>Annual property tax <span class="req">*</span></label>
          <input type="number" id="tax" value="${esc(d.tax)}" placeholder="6500"></div>
        <div class="field"><label>Tax year</label>
          <input type="number" id="taxYear" value="${esc(d.taxYear)}" placeholder="2025"></div>
      </div>
      <div class="field"><label>Lot size / dimensions</label>
        <input type="text" id="lot" value="${esc(d.lot)}" placeholder="50 x 120 ft"></div>
      <div class="field"><label>Survey available?</label>
        ${radios('survey',[{v:'yes',l:'Yes'},{v:'no',l:'No'}],d.survey)}</div>`,
    collect:d=>{d.legal=$("#legal").value.trim();d.tax=$("#tax").value.trim();d.taxYear=$("#taxYear").value.trim();d.lot=$("#lot").value.trim();d.survey=getRadio('survey');},
    validate:d=> !d.tax?'Enter the annual property tax.':null
  },

  { id:'terms', title:'Listing Terms', count:'Price, dates & remuneration',
    note:'Commission is the <b>seller’s decision</b> and any condition where it changes must be in writing on the agreement.',
    render:d=>`
      <div class="field"><label>List price <span class="req">*</span></label>
        <input type="number" id="price" value="${esc(d.price)}" placeholder="1199000"></div>
      <div class="row">
        <div class="field"><label>Commencement date <span class="req">*</span></label>
          <input type="date" id="start" value="${esc(d.startDate)}"></div>
        <div class="field"><label>Expiry date <span class="req">*</span></label>
          <input type="date" id="expiry" value="${esc(d.expiry)}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Total listing remuneration (%)</label>
          <input type="text" id="commTotal" value="${esc(d.commTotal)}" placeholder="e.g. 4%"></div>
        <div class="field"><label>Offered to co-operating brokerage</label>
          <input type="text" id="commCoop" value="${esc(d.commCoop)}" placeholder="e.g. 2%"></div>
      </div>
      <div class="field"><label>Holdover period (days)</label>
        <input type="number" id="holdover" value="${esc(d.holdover)}" placeholder="90"></div>`,
    collect:d=>{d.price=$("#price").value.trim();d.startDate=$("#start").value;d.expiry=$("#expiry").value;
      d.commTotal=$("#commTotal").value.trim();d.commCoop=$("#commCoop").value.trim();d.holdover=$("#holdover").value.trim();},
    validate:d=> !d.price?'Enter the list price.': !d.startDate?'Enter the commencement date.': !d.expiry?'Enter the expiry date.':null
  },

  { id:'offers', title:'Offer Handling', count:'Form 244 trigger',
    note:'If you delay the presentation of offers, a <b>Seller’s Direction (Form 244)</b> is required. Decide the bidding approach with the seller now, not at the first offer.',
    render:d=>`
      <div class="field"><label>Delaying the presentation of offers? <span class="req">*</span></label>
        ${radios('delay',[{v:'yes',l:'Yes — hold offers'},{v:'no',l:'No — review as received'}],d.delay)}</div>
      <div class="row" id="offerDateWrap" style="${d.delay==='yes'?'':'display:none'}">
        <div class="field"><label>Offer review date</label><input type="date" id="offerDate" value="${esc(d.offerDate)}"></div>
        <div class="field"><label>Offer review time</label><input type="time" id="offerTime" value="${esc(d.offerTime)}"></div>
      </div>
      <div class="field"><label>Bidding process election <span class="req">*</span></label>
        ${radios('bidding',[{v:'open',l:'Open / disclosed'},{v:'closed',l:'Traditional / undisclosed'}],d.bidding)}
        <div class="hint">Under TRESA you must handle and disclose offers consistently to all buyers.</div></div>`,
    onMount:d=>{document.querySelectorAll('input[name="delay"]').forEach(r=>r.addEventListener('change',()=>{
      $("#offerDateWrap").style.display=getRadio('delay')==='yes'?'flex':'none';}));},
    collect:d=>{d.delay=getRadio('delay');d.offerDate=($("#offerDate")||{}).value||'';d.offerTime=($("#offerTime")||{}).value||'';d.bidding=getRadio('bidding');},
    validate:d=> !d.delay?'Choose an offer-handling approach.': !d.bidding?'Choose a bidding election.':null
  },

  { id:'inclusions', title:'Inclusions & Rentals', count:'Chattels, fixtures & contracts',
    note:'Be precise — vague inclusion lists are a top source of post-acceptance disputes.',
    render:d=>`
      <div class="field"><label>Chattels included</label>
        <textarea id="incl" placeholder="Fridge, stove, dishwasher, washer, dryer, all window coverings, ELFs...">${esc(d.incl)}</textarea></div>
      <div class="field"><label>Fixtures excluded</label>
        <textarea id="excl" placeholder="Dining room chandelier, mounted TVs...">${esc(d.excl)}</textarea></div>
      <div class="field"><label>Rental / leased items</label>
        <textarea id="rentals" placeholder="Hot water tank (Enercare), furnace, water softener, alarm...">${esc(d.rentals)}</textarea></div>`,
    collect:d=>{d.incl=$("#incl").value.trim();d.excl=$("#excl").value.trim();d.rentals=$("#rentals").value.trim();},
    validate:d=>null
  },

  { id:'condo', title:'Condo Details', count:'Condo listings only',
    visible:d=>d.ptype==='condo',
    note:'<b>Order the Status Certificate the moment the agreement is signed</b> — the corporation can take up to 10 days and it gates offer review.',
    render:d=>`
      <div class="row">
        <div class="field"><label>Condo corporation name/number</label><input type="text" id="corp" value="${esc(d.corp)}" placeholder="HCC No. 000"></div>
        <div class="field"><label>Monthly maintenance fee</label><input type="number" id="fee" value="${esc(d.fee)}" placeholder="650"></div>
      </div>
      <div class="field"><label>Fee includes</label><input type="text" id="feeIncl" value="${esc(d.feeIncl)}" placeholder="Water, heat, building insurance, common elements..."></div>
      <div class="row">
        <div class="field"><label>Parking</label><input type="text" id="parking" value="${esc(d.parking)}" placeholder="1 owned / exclusive-use #00"></div>
        <div class="field"><label>Locker</label><input type="text" id="locker" value="${esc(d.locker)}" placeholder="1 owned / none"></div>
      </div>
      <div class="field"><label>Status Certificate ordered?</label>
        ${radios('statusCert',[{v:'yes',l:'Ordered'},{v:'no',l:'Not yet'}],d.statusCert)}</div>`,
    collect:d=>{d.corp=$("#corp").value.trim();d.fee=$("#fee").value.trim();d.feeIncl=$("#feeIncl").value.trim();
      d.parking=$("#parking").value.trim();d.locker=$("#locker").value.trim();d.statusCert=getRadio('statusCert');},
    validate:d=>null
  },

  { id:'tenant', title:'Tenant Details', count:'Tenant-occupied only',
    visible:d=>d.occ==='tenant',
    note:'Showings must respect the Residential Tenancies Act. Get the tenant’s written consent for photos and showings on file.',
    render:d=>`
      <div class="row">
        <div class="field"><label>Lease end date</label><input type="date" id="leaseEnd" value="${esc(d.leaseEnd)}"></div>
        <div class="field"><label>Monthly rent</label><input type="number" id="rent" value="${esc(d.rent)}" placeholder="2400"></div>
      </div>
      <div class="field"><label>Tenant name</label><input type="text" id="tenantName" value="${esc(d.tenantName)}"></div>
      <div class="field"><label>Written consent for photos & showings on file?</label>
        ${radios('tenantConsent',[{v:'yes',l:'Yes'},{v:'no',l:'Not yet'}],d.tenantConsent)}</div>`,
    collect:d=>{d.leaseEnd=$("#leaseEnd").value;d.rent=$("#rent").value.trim();d.tenantName=$("#tenantName").value.trim();d.tenantConsent=getRadio('tenantConsent');},
    validate:d=>null
  },

  { id:'spis', title:'Disclosure (SPIS)', count:'Optional',
    note:'The Seller Property Information Statement (Form 220 residential / 221 condo) is optional. Document the seller’s decision either way.',
    render:d=>`
      <div class="field"><label>Completing a SPIS? <span class="req">*</span></label>
        ${radios('spis',[{v:'yes',l:'Yes — complete SPIS'},{v:'no',l:'No — declined'}],d.spis)}</div>`,
    collect:d=>{d.spis=getRadio('spis');},
    validate:d=> !d.spis?'Record the seller’s SPIS decision.':null
  },

  { id:'review', title:'Review & Hand-Off', review:true }
];

function visibleSteps(){ return steps.filter(s=>!s.visible || s.visible(data)); }
function curStep(){ return visibleSteps()[stepIdx]; }

/* ---------- rendering ---------- */
function setBar(){
  const vs=visibleSteps(); const pct = stepIdx<=0?0:(stepIdx/(vs.length-1))*100;
  $("#bar").style.width=pct+"%";
}
function renderStep(){
  const s=curStep(); setBar();
  if(s.start) return renderStart();
  if(s.review) return renderReview();
  const vs=visibleSteps();
  $("#screen").innerHTML=`
    <div class="step-meta"><span class="count">Step ${stepIdx} of ${vs.length-2} · ${esc(s.count||'')}</span>
      <span class="saved" id="savedFlag"></span></div>
    <h2 class="step-title">${esc(s.title)}</h2>
    <p class="step-note">${s.note||''}</p>
    <form id="stepForm" onsubmit="return false">${s.render(data)}</form>
    <div class="err-msg" id="err"></div>
    <div class="nav">
      <button class="btn-ghost" onclick="back()">← Back</button>
      <div style="display:flex;gap:10px">
        <button class="btn-text" onclick="saveProgress(true)">Save &amp; exit</button>
        <button class="btn-primary" onclick="next()">Continue →</button>
      </div>
    </div>`;
  if(s.onMount) s.onMount(data);
}
function collectStep(d){const s=curStep(); if(s.collect) s.collect(d);}

function next(){
  const s=curStep(); collectStep(data);
  const err=s.validate?s.validate(data):null;
  if(err){$("#err").textContent=err; return;}
  saveProgress(false);
  stepIdx++; window.scrollTo({top:0,behavior:'smooth'}); renderStep();
}
function back(){
  const s=curStep(); if(s.collect) try{s.collect(data);}catch(e){}
  if(stepIdx===0) return;
  stepIdx--; window.scrollTo({top:0,behavior:'smooth'}); renderStep();
}

/* ---------- start screen ---------- */
async function renderStart(){
  setBar();
  const keys=await store.list('listing:');
  const items=[];
  for(const k of keys){const v=await store.get(k); if(v){let o; try{o=JSON.parse(v);}catch(e){o=null;} if(o) items.push({k,o});}}
  items.sort((a,b)=>(b.o._updated||0)-(a.o._updated||0));
  let saved='';
  if(items.length){
    saved=`<div class="section-label">Resume a listing</div><div class="saved-list">`+
      items.map(it=>`<div class="saved-item">
        <div class="si-main"><div class="si-addr">${esc(it.o.address||'Untitled listing')}</div>
          <div class="si-meta">${esc(it.o.city||'')}${it.o.price?' · $'+Number(it.o.price).toLocaleString():''} · saved ${new Date(it.o._updated||Date.now()).toLocaleDateString()}</div></div>
        <div class="si-btns">
          <button class="mini btn-primary" onclick="resume('${it.k}')">Open</button>
          <button class="mini del" onclick="removeListing('${it.k}')">Delete</button>
        </div></div>`).join('')+`</div>`;
  }
  $("#screen").innerHTML=`
    <div class="step-meta"><span class="count">Begin</span></div>
    <h2 class="step-title">Onboard a new listing</h2>
    <p class="step-note">Eleven quick steps, in the order TRESA expects. Progress saves automatically — you can stop and resume any listing. At the end you’ll get a ready-to-use data package, your signer list, and the exact forms to prepare.</p>
    <div class="start-actions">
      <button class="btn-primary" onclick="startNew()">Start a new listing →</button>
    </div>
    ${saved}
    <div class="disclaimer">This tool gathers and organizes your inputs. The actual OREA forms are filled and signed inside WEBForms / Transaction Desk &amp; Authentisign (the licensed environment). Not legal advice; follow current Cornerstone/ITSO MLS rules and Real policy.</div>`;
}
function startNew(){ data=blank(); listingKey='listing:'+Date.now(); stepIdx=1; renderStep(); }
async function resume(k){ const v=await store.get(k); if(!v){toast('Could not open');return;} data=JSON.parse(v); listingKey=k; data.sellers=data.sellers||[{}]; data.sellerCount=data.sellerCount||1; stepIdx=1; renderStep(); }
async function removeListing(k){ await store.del(k); toast('Listing deleted'); renderStart(); }

async function saveProgress(exit){
  if(!listingKey) listingKey='listing:'+Date.now();
  data._updated=Date.now();
  try{ await store.set(listingKey, JSON.stringify(data)); }catch(e){}
  if(exit){ toast('Saved'); stepIdx=0; window.scrollTo({top:0,behavior:'smooth'}); renderStart(); }
  else { const f=$("#savedFlag"); if(f) f.textContent='Saved ✓'; }
}

async function goPhase2(){
  try{ await saveProgress(false); }catch(e){}
  window.location.href='broker-load.html?listing='+encodeURIComponent(listingKey);
}

/* ---------- review / output ---------- */
function formsList(d){
  const f=[];
  f.push(['REQ','RECO Information Guide','Pre-service disclosure — record of delivery + acknowledgement']);
  if(d.rel==='customer') f.push(['REQ','OREA Form 216','Seller Self-Represented Party Acknowledgement and Consent']);
  else f.push(['REQ','OREA Form 271','Listing Agreement — Seller Designated Representation Agreement']);
  d.sellers.forEach((s,i)=>f.push(['REQ','OREA Form 630 — Seller '+(i+1),'FINTRAC Individual Identification Information Record'+(s.name?' ('+s.name+')':'')]));
  if(d.delay==='yes') f.push(['REQ','OREA Form 244','Seller’s Direction re: Property/Offers (offers delayed)']);
  if(d.spis==='yes') f.push(['OPT', d.ptype==='condo'?'OREA Form 221':'OREA Form 220', 'Seller Property Information Statement ('+(d.ptype==='condo'?'Condominium':'Residential')+')']);
  f.push(['REQ','Cornerstone MLS Property Information Form','Data-entry source for the MLS broker load']);
  return f;
}
function buildPackage(d){
  const L=[]; const line=(k,v)=>{ if(v!==undefined&&v!==null&&v!=='') L.push(`  ${k}: ${v}`);};
  const D=s=>s?new Date(s+'T00:00').toLocaleDateString('en-CA'):'';
  const money=v=>v?'$'+Number(v).toLocaleString():'';
  L.push('LISTING INTAKE — DATA PACKAGE');
  L.push('Generated '+new Date().toLocaleString('en-CA'));
  L.push('');
  L.push('PROPERTY');
  line('Address', d.address); line('City/Area', d.city);
  line('Type', d.ptype==='condo'?'Condo':'Freehold'); line('Occupancy', d.occ);
  line('Legal/PIN', d.legal); line('Lot', d.lot);
  line('Annual tax', d.tax?money(d.tax)+(d.taxYear?' ('+d.taxYear+')':''):''); line('Survey', d.survey);
  L.push('');
  L.push('LISTING TERMS');
  line('List price', money(d.price)); line('Commencement', D(d.startDate)); line('Expiry', D(d.expiry));
  line('Total remuneration', d.commTotal); line('Co-op offered', d.commCoop); line('Holdover (days)', d.holdover);
  L.push('');
  L.push('REPRESENTATION & DISCLOSURE');
  line('Relationship', d.rel==='customer'?'Self-represented party (Form 216)':'Client (Form 271)');
  line('RECO Guide provided', d.reco+(d.recoDate?' on '+D(d.recoDate):''));
  line('SPIS', d.spis==='yes'?'Yes':'Declined');
  L.push('');
  L.push('OFFER HANDLING');
  line('Offers delayed', d.delay==='yes'?('Yes — review '+D(d.offerDate)+' '+(d.offerTime||'')):'No');
  line('Bidding', d.bidding); if(d.delay==='yes') line('Form 244 required','YES');
  L.push('');
  L.push('SELLERS');
  d.sellers.forEach((s,i)=>{ L.push('  Seller '+(i+1)+':');
    line('  Name', s.name); line('  Email', s.email); line('  Phone', s.phone);
    line('  FINTRAC ID', (s.idv==='yes'?'Verified':'Pending')+(s.idtype?' — '+s.idtype:'')+(s.iddate?' ('+D(s.iddate)+')':'')); });
  L.push('  [Enter actual ID numbers directly in Form 630 in WEBForms — not stored here]');
  L.push('');
  L.push('INCLUSIONS');
  line('Included', d.incl); line('Excluded', d.excl); line('Rentals', d.rentals);
  if(d.ptype==='condo'){ L.push(''); L.push('CONDO');
    line('Corporation', d.corp); line('Maint. fee', d.fee?money(d.fee)+'/mo':''); line('Fee includes', d.feeIncl);
    line('Parking', d.parking); line('Locker', d.locker); line('Status cert', d.statusCert==='yes'?'Ordered':'Not yet'); }
  if(d.occ==='tenant'){ L.push(''); L.push('TENANT');
    line('Lease end', D(d.leaseEnd)); line('Rent', d.rent?money(d.rent)+'/mo':''); line('Tenant', d.tenantName);
    line('Showing consent', d.tenantConsent==='yes'?'On file':'Not yet'); }
  L.push('');
  L.push('AGENT: '+(d.agent||'')+'  ·  BROKERAGE: '+(d.brokerage||''));
  return L.join('\n');
}
function renderReview(){
  collectStepSafe();
  setBar(); $("#bar").style.width='100%';
  const d=data; const forms=formsList(d); const pkg=buildPackage(d);
  data._pkg=pkg;
  const signers=d.sellers.map(s=>`<div class="signer"><span class="dot"></span>
    <span class="s-name">${esc(s.name||'(unnamed seller)')}</span>
    <span class="s-email ${isEmail(s.email)?'':'missing'}">${esc(s.email||'no email — add before sending')}</span></div>`).join('');
  $("#screen").innerHTML=`
    <div class="step-meta"><span class="count">Complete</span><span class="saved">Saved ✓</span></div>
    <h2 class="step-title">${esc(d.address||'Listing')} — ready to prepare</h2>
    <p class="step-note">Everything’s gathered. Here’s what to prepare, your signer list, and a clean data package to paste into Transaction Desk.</p>

    <div class="section-label">Forms to prepare</div>
    <div class="forms-grid">${forms.map(f=>`<div class="form-row">
      <span class="fr-badge ${f[0]==='REQ'?'fr-req':'fr-opt'}">${f[0]}</span>
      <div class="fr-body"><div class="fr-name">${esc(f[1])}</div><div class="fr-desc">${esc(f[2])}</div></div></div>`).join('')}</div>

    <div class="section-label">Signers for Authentisign</div>
    <div class="signers">${signers}</div>

    <div class="section-label">Data package</div>
    <div class="pkg">
      <div class="pkg-head"><span>Copy into Transaction Desk</span>
        <button class="mini btn-primary" onclick="copyPkg()">Copy</button></div>
      <textarea id="pkgText" readonly>${esc(pkg)}</textarea>
    </div>

    <div class="section-label">Finish in Transaction Desk &amp; Authentisign</div>
    <ol class="handoff">
      <li>In <b>Transaction Desk / WEBForms</b>, create the transaction and pull the listing from your MLS so the OREA forms pre-fill.</li>
      <li>Add the forms flagged above; fill any gaps from this data package (and enter <b>FINTRAC ID numbers directly in Form 630</b>).</li>
      <li>Launch <b>Authentisign</b>, add the signers listed above by email, drop signature/initial blocks, and send.</li>
      <li>Once executed, submit the deal to <b>Real</b> for compliance &amp; retention (TRESA: 6 yrs; FINTRAC: 5 yrs).</li>
    </ol>

    <button class="btn-primary" style="width:100%;margin-top:10px;padding:15px 22px" onclick="goPhase2()">Continue to Broker Load →</button>
    <div class="hint" style="text-align:center;margin:8px 0 0">Opens the broker-load walkthrough with this listing ready to go.</div>

    <div class="nav">
      <button class="btn-ghost" onclick="back()">← Back</button>
      <div style="display:flex;gap:10px">
        <button class="btn-text" onclick="window.print()">Print</button>
        <button class="btn-primary" onclick="saveProgress(true)">Save &amp; finish</button>
      </div>
    </div>
    <div class="disclaimer">Form numbers reflect current OREA standard forms; field labels live behind your member login. This organizes inputs only — preparation, signing, and retention happen in your licensed brokerage tools. Not legal advice.</div>`;
}
function collectStepSafe(){ try{ const vs=visibleSteps(); const prev=vs[stepIdx-1]; }catch(e){} }

async function copyPkg(){
  const t=$("#pkgText"); 
  try{ await navigator.clipboard.writeText(t.value); toast('Package copied'); }
  catch(e){ t.removeAttribute('readonly'); t.select(); try{document.execCommand('copy');toast('Package copied');}catch(_){toast('Select the text to copy');} t.setAttribute('readonly','');}
}

/* boot */
renderStart();
</script>
