<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vetting a Lease Application · Realtor Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#10302A;--ink-2:#0B221D;--paper:#F4F1E8;--card:#FBFAF4;--line:#DED7C6;--gold:#E0A227;--green:#2E7D5B;--muted:#5B6A60;
    --display:'Bricolage Grotesque',system-ui,sans-serif;--body:'Hanken Grotesk',system-ui,sans-serif;}
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--body);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
  a{color:inherit}
  /* top bar */
  .top{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
  .top-in{max-width:780px;margin:0 auto;height:62px;padding:0 22px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .back{display:inline-flex;align-items:center;gap:8px;color:#cfe0d8;text-decoration:none;font-weight:600;font-size:.92rem;transition:color .15s}
  .back:hover{color:#fff}
  .brand{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:.5ch}
  .brand .tick{width:9px;height:9px;background:var(--gold);border-radius:2px;transform:rotate(45deg);display:inline-block}
  .top .spacer{width:84px}
  /* main */
  .main{max-width:780px;margin:0 auto;padding:34px 22px 96px}
  .intro .kicker{font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .intro h1{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,4.5vw,2.5rem);letter-spacing:-.02em;margin:8px 0 0}
  .intro p{color:var(--muted);margin:8px 0 0;max-width:60ch}
  /* progress */
  .progress{margin:28px 0 22px}
  .bar{height:6px;background:#E7E1D2;border-radius:100px;overflow:hidden}
  .bar span{display:block;height:100%;width:0;background:var(--gold);border-radius:100px;transition:width .3s ease}
  .dots{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
  .dot{font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--muted);display:flex;align-items:center;gap:7px;opacity:.6}
  .dot b{width:8px;height:8px;border-radius:50%;background:#CFC8B6;display:inline-block}
  .dot.done{opacity:1}.dot.done b{background:var(--green)}
  .dot.active{opacity:1;color:var(--ink)}.dot.active b{background:var(--gold);box-shadow:0 0 0 4px rgba(224,162,39,.2)}
  /* card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 26px;box-shadow:0 30px 60px -48px rgba(16,48,42,.4)}
  .step{display:none}.step.active{display:block}
  .step h2{font-family:var(--display);font-weight:700;font-size:1.4rem;letter-spacing:-.01em;margin:0 0 18px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:16px 16px}
  .field{grid-column:1/-1;min-width:0}
  .field.half{grid-column:span 1}
  .flbl{display:block;font-size:.84rem;font-weight:700;margin-bottom:7px}
  .req{color:var(--gold);margin-left:3px}
  input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 13px;font-family:var(--body);font-size:1rem;color:var(--ink);transition:border-color .15s,box-shadow .15s}
  textarea{resize:vertical;min-height:84px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(46,125,91,.16)}
  .field.invalid input,.field.invalid select,.field.invalid textarea,.field.invalid .radios{border-color:#c0473a;box-shadow:0 0 0 3px rgba(192,71,58,.14)}
  .help{color:var(--muted);font-size:.8rem;margin-top:6px}
  .radios{display:flex;flex-wrap:wrap;gap:8px;border:1px solid transparent;border-radius:11px}
  .radio,.check{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-weight:600;font-size:.92rem;cursor:pointer;transition:border-color .15s,background .15s}
  .radio:hover,.check:hover{border-color:#c8c0ac}
  .radio input,.check input{width:auto;accent-color:var(--green)}
  .checks{display:flex;flex-direction:column;gap:8px}
  .check-field .check{width:100%}
  /* nav */
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
  .btn{border:0;cursor:pointer;font-family:var(--body);font-weight:700;font-size:1rem;padding:13px 22px;border-radius:12px;background:var(--ink);color:#fff;transition:transform .12s,background .2s}
  .btn:hover{background:var(--ink-2);transform:translateY(-1px)}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:#ECE7D9;transform:none}
  .btn.gold{background:var(--gold);color:var(--ink)}
  .btn.gold:hover{background:#cf9620}
  .btn[hidden]{display:none}
  /* review */
  .rev-block{border-top:1px solid var(--line);padding:16px 0}
  .rev-block:first-child{border-top:0;padding-top:0}
  .rev-block h3{font-family:var(--display);font-weight:700;font-size:1.05rem;margin:0 0 8px}
  .rev-row{display:flex;gap:12px;padding:4px 0;font-size:.95rem}
  .rev-row .k{color:var(--muted);min-width:42%;max-width:42%}
  .rev-row .v{font-weight:600}
  .rev-empty{color:var(--muted);font-size:.9rem}
  .rev-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
  .done-note{background:rgba(46,125,91,.1);border:1px solid rgba(46,125,91,.25);color:var(--ink);border-radius:12px;padding:12px 14px;font-weight:600;font-size:.92rem;margin-bottom:18px}
  @media(max-width:600px){.fields{grid-template-columns:1fr}.field.half{grid-column:1/-1}.top .spacer{display:none}}
  @media print{.top,.progress,.nav,.rev-actions{display:none!important}.card{box-shadow:none;border:0}}
  .rtgate{position:fixed;inset:0;z-index:1000;background:var(--paper);display:flex;align-items:center;justify-content:center}
  .rtgate-card{display:flex;flex-direction:column;align-items:center;gap:16px;color:var(--muted);font-weight:600}
  .rtgate-spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--gold);animation:rtspin .8s linear infinite}
  @keyframes rtspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="rtGate" class="rtgate"><div class="rtgate-card"><div class="rtgate-spin"></div><p>Checking your access&hellip;</p></div></div>
  <header class="top">
    <div class="top-in">
      <a class="back" href="../index.html">&larr; Dashboard</a>
      <div class="brand"><span class="tick"></span> Realtor Tutor</div>
      <div class="spacer"></div>
    </div>
  </header>
  <main class="main">
    <div class="intro">
      <div class="kicker">LISTING WIZARD</div>
      <h1>Vetting a Lease Application</h1>
      <p>Screen a prospective tenant fairly and thoroughly — application, income, credit, references, and terms — then hand a clean summary to your landlord.</p>
    </div>
    <div class="progress">
      <div class="bar"><span id="barFill"></span></div>
      <div class="dots" id="dots"></div>
    </div>
    <form id="wiz" class="card" novalidate>
      <div id="host"></div>
      <div id="review" style="display:none"></div>
      <div class="nav">
        <button type="button" class="btn ghost" id="backBtn" hidden>Back</button>
        <button type="button" class="btn" id="nextBtn">Next</button>
      </div>
    </form>
  </main>
<script src="../gate.js"></script>
<script>
(async function(){
  const ok = await window.requireMemberAccess({ home:'../index.html' });
  if(ok){ const g=document.getElementById('rtGate'); if(g) g.remove(); }
})();
</script>
<script>
const CONFIG = {"steps": [{"title": "Applicant & application", "fields": [{"id": "applicant1", "label": "Applicant — full legal name", "type": "text", "required": true, "help": "Ontario's Human Rights Code prohibits screening on protected grounds (family status, age, ethnicity, receipt of public assistance, etc.). Income, credit, references, rental history and a guarantor are all permitted tools per the LTB."}, {"id": "applicant2", "label": "Co-applicant (if any)", "type": "text", "half": true}, {"id": "form410", "label": "Rental Application (Form 410) received", "type": "check", "half": true}, {"id": "movein", "label": "Desired move-in date", "type": "date", "half": true}, {"id": "term", "label": "Lease term (e.g. 1 year)", "type": "text", "half": true}, {"id": "rent", "label": "Monthly rent offered ($)", "type": "number", "half": true}]}, {"title": "Identity & income", "fields": [{"id": "idverified", "label": "Government photo ID verified", "type": "check", "half": true}, {"id": "employer", "label": "Employer", "type": "text", "half": true}, {"id": "position", "label": "Position", "type": "text", "half": true}, {"id": "employlength", "label": "Length of employment", "type": "text", "half": true}, {"id": "income", "label": "Gross monthly income ($)", "type": "number", "half": true, "help": "Common guideline: rent ≤ ~30% of gross income (income ≈ 3× rent). A guideline, not a hard rule."}, {"id": "proof", "label": "Employment letter / pay stubs received", "type": "check", "half": true}, {"id": "otherincome", "label": "Other income / notes", "type": "textarea"}]}, {"title": "Credit & history", "fields": [{"id": "creditconsent", "label": "Written consent to credit check obtained", "type": "check", "half": true}, {"id": "creditscore", "label": "Credit score / rating", "type": "text", "half": true}, {"id": "creditreport", "label": "Credit report received", "type": "check", "half": true}, {"id": "priorissues", "label": "Past evictions, judgments, or collections (note any)", "type": "textarea"}]}, {"title": "References", "fields": [{"id": "curlandlord", "label": "Current landlord — name & phone", "type": "text"}, {"id": "curreason", "label": "Reason for leaving", "type": "text"}, {"id": "prevlandlord", "label": "Previous landlord — name & phone", "type": "text"}, {"id": "employerref", "label": "Employer / personal reference", "type": "text"}, {"id": "refscontacted", "label": "References contacted", "type": "check"}, {"id": "refnotes", "label": "Reference notes", "type": "textarea"}]}, {"title": "Household & terms", "fields": [{"id": "occupants", "label": "Number of occupants", "type": "number", "half": true}, {"id": "pets", "label": "Pets (type / none)", "type": "text", "half": true}, {"id": "smoking", "label": "Smoking", "type": "radio", "options": ["Non-smoker", "Smoker"], "half": true}, {"id": "parking", "label": "Vehicles / parking needed", "type": "text", "half": true}, {"id": "guarantor", "label": "Guarantor", "type": "radio", "options": ["Not required", "Required"], "half": true}, {"id": "guarantorinfo", "label": "Guarantor — name & details (if required)", "type": "text"}, {"id": "deposit", "label": "First & last month's rent confirmed", "type": "check", "half": true}, {"id": "keydeposit", "label": "Key deposit", "type": "text", "half": true}, {"id": "recommendation", "label": "Your recommendation to the landlord", "type": "textarea"}]}], "title": "Vetting a Lease Application", "kicker": "LISTING WIZARD", "subtitle": "Screen a prospective tenant fairly and thoroughly — application, income, credit, references, and terms — then hand a clean summary to your landlord."};
const steps = CONFIG.steps;
const host=document.getElementById('host'), reviewEl=document.getElementById('review');
const dotsEl=document.getElementById('dots'), bar=document.getElementById('barFill');
const backBtn=document.getElementById('backBtn'), nextBtn=document.getElementById('nextBtn');
let cur=0; const total=steps.length; // review index = total

function fieldHTML(f){
  const half=f.half?' half':''; const req=f.required?'<span class="req">*</span>':'';
  const ph=f.placeholder?`placeholder="${f.placeholder}"`:''; const rq=f.required?'data-req':'';
  const help=f.help?`<div class="help">${f.help}</div>`:'';
  if(f.type==='check'){
    return `<div class="field${half} check-field"><label class="check"><input type="checkbox" id="${f.id}"> <span>${f.label}</span></label>${help}</div>`;
  }
  let c='';
  if(['text','email','tel','number','date'].includes(f.type)){ c=`<input id="${f.id}" type="${f.type}" ${ph} ${rq}>`; }
  else if(f.type==='textarea'){ c=`<textarea id="${f.id}" ${ph} ${rq}></textarea>`; }
  else if(f.type==='select'){ c=`<select id="${f.id}" ${rq}><option value="">Choose&hellip;</option>${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`; }
  else if(f.type==='radio'){ c=`<div class="radios" id="${f.id}" ${f.required?'data-req-group':''}>${f.options.map(o=>`<label class="radio"><input type="radio" name="${f.id}" value="${o}"> ${o}</label>`).join('')}</div>`; }
  return `<div class="field${half}"><label class="flbl" for="${f.id}">${f.label}${req}</label>${c}${help}</div>`;
}
// build steps
steps.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='step'+(i===0?' active':'');
  d.innerHTML=`<h2>${s.title}</h2><div class="fields">${s.fields.map(fieldHTML).join('')}</div>`;
  host.appendChild(d);
});
// dots
[...steps.map(s=>s.title),'Review'].forEach((t,i)=>{
  const el=document.createElement('div'); el.className='dot'+(i===0?' active':''); el.dataset.i=i;
  el.innerHTML=`<b></b>${t}`; dotsEl.appendChild(el);
});
const stepEls=[...host.querySelectorAll('.step')];
const dotEls=[...dotsEl.querySelectorAll('.dot')];

function valueOf(f){
  if(f.type==='radio'){ const c=document.querySelector(`input[name="${f.id}"]:checked`); return c?c.value:''; }
  if(f.type==='check'){ const e=document.getElementById(f.id); return e&&e.checked?'Yes':''; }
  const e=document.getElementById(f.id); return e?(e.value||'').trim():'';
}
function validateStep(i){
  let ok=true; const el=stepEls[i];
  el.querySelectorAll('[data-req]').forEach(inp=>{
    const fld=inp.closest('.field'); const bad=!inp.value.trim();
    fld.classList.toggle('invalid',bad); if(bad) ok=false;
  });
  el.querySelectorAll('[data-req-group]').forEach(g=>{
    const bad=!g.querySelector('input:checked'); const fld=g.closest('.field');
    fld.classList.toggle('invalid',bad); if(bad) ok=false;
  });
  return ok;
}
function buildReview(){
  let html='';
  steps.forEach(s=>{
    const rows=s.fields.map(f=>{const v=valueOf(f);return v?`<div class="rev-row"><div class="k">${f.label}</div><div class="v">${v.replace(/</g,'&lt;')}</div></div>`:''}).filter(Boolean).join('');
    html+=`<div class="rev-block"><h3>${s.title}</h3>${rows||'<div class="rev-empty">Nothing entered.</div>'}</div>`;
  });
  reviewEl.innerHTML=`<div class="done-note">Looks good. Review below, then copy, print, or email it &mdash; or jump back to change anything.</div>${html}
    <div class="rev-actions">
      <button type="button" class="btn gold" id="copyBtn">Copy summary</button>
      <button type="button" class="btn ghost" id="printBtn">Print</button>
      <button type="button" class="btn ghost" id="emailBtn">Email it</button>
      <button type="button" class="btn ghost" id="resetBtn">Start over</button>
    </div>`;
  document.getElementById('copyBtn').onclick=copySummary;
  document.getElementById('printBtn').onclick=()=>window.print();
  document.getElementById('emailBtn').onclick=emailSummary;
  document.getElementById('resetBtn').onclick=()=>location.reload();
}
function summaryText(){
  let out=CONFIG.title+'\n\n';
  steps.forEach(s=>{
    const rows=s.fields.map(f=>{const v=valueOf(f);return v?`  ${f.label}: ${v}`:''}).filter(Boolean);
    if(rows.length){ out+=s.title+'\n'+rows.join('\n')+'\n\n'; }
  });
  return out.trim();
}
function copySummary(){
  const t=summaryText(); const b=document.getElementById('copyBtn');
  navigator.clipboard.writeText(t).then(()=>{b.textContent='Copied!';setTimeout(()=>b.textContent='Copy summary',1600);})
    .catch(()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent='Copied!';setTimeout(()=>b.textContent='Copy summary',1600);});
}
function emailSummary(){
  const addr=valueOf({id:'address',type:'text'});
  const subj=encodeURIComponent(CONFIG.title+(addr?(' — '+addr):''));
  const body=encodeURIComponent(summaryText());
  window.location.href=`mailto:?subject=${subj}&body=${body}`;
}
function show(i){
  cur=i;
  stepEls.forEach((e,idx)=>e.classList.toggle('active',idx===i && i<total));
  reviewEl.style.display = i===total?'block':'none';
  dotEls.forEach((d,idx)=>{d.classList.toggle('active',idx===i);d.classList.toggle('done',idx<i);});
  bar.style.width=((i)/(total))*100+'%';
  backBtn.hidden = i===0;
  if(i===total){ nextBtn.hidden=true; }
  else { nextBtn.hidden=false; nextBtn.textContent = i===total-1?'Review':'Next'; }
  window.scrollTo({top:0,behavior:'smooth'});
}
nextBtn.onclick=()=>{ if(cur<total && !validateStep(cur)) return; if(cur===total-1){ buildReview(); } show(Math.min(cur+1,total)); };
backBtn.onclick=()=>show(Math.max(cur-1,0));
dotEls.forEach(d=>d.onclick=()=>{ const i=+d.dataset.i; if(i<=cur){ show(i); } });
bar.style.width='0%';
</script>
</body>
</html>
