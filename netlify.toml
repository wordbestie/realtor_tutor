# Netlify config for Realtor Tutor

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Stripe needs the raw, unparsed body to verify the webhook signature.
[functions."stripe-webhook"]
  # (esbuild bundles node_modules automatically; nothing extra needed)

# Single-page app: send everything that isn't a real file or function to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
